name: Bug report
description: Report a reproducible SDK defect without private operational data.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: Provide the prerelease tag, commit, or package version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node and operating system
      description: Provide the Node version and OS version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Give a minimal redacted reproduction with synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety confirmation
      options:
        - label: I confirm this report contains no private data, personal data, secrets, credentials, live ledgers, or vault data.
          required: true
